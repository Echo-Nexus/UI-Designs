<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neumorphic Sign-In Page</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Remix Icon CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <form>
      <div class="card-top">
        <div class="card-top-input">
          <label for="email">Username</label>
          <input
            type="email"
            name="email"
            id="email"
            placeholder="admin@example.com"
          />
        </div>
        <div class="card-top-input">
          <label for="password">Password</label>
          <input
            type="password"
            name="password"
            id="password"
            placeholder="Enter Password"
          />
        </div>
        <div class="card-top-input-password">
          <div class="user-helps">
            <input type="checkbox" name="remember" id="remember_me" />
            <label for="remember_me">Remember me</label>
          </div>
          <a href="/forgot-password" class="forgot-password"
            >Forgot password?</a
          >
        </div>
        <button class="sign-in">Sign In</button>
      </div>
      <div class="card-bottom">
        <p class="card-bottom-para">or sign in with</p>
        <div class="icon-container">
          <i class="ri-facebook-fill icon"></i>
          <i class="ri-linkedin-fill icon"></i>
          <i class="ri-twitter-fill icon"></i>
        </div>
      </div>
    </form>
  </body>
</html>
